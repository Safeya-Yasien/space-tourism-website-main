<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/utlis.css" />
    <link rel="stylesheet" href="css/styles.css" />

    <title>Frontend Mentor | Space tourism website</title>
  </head>
  <body>
    <div class="page-hero page-hero--crew">
      <header class="header flex-align-center">
        <div class="header__logo flex-align-center">
          <a href="index.html" aria-label="Space tourism website - Home">
            <img src="assets/shared/logo.svg" alt="" />
          </a>
        </div>

        <div class="header__line"></div>

        <button
          class="mobile-nav-toggle"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <div class="mobile-nav__icon">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </button>

        <nav class="primary-nav" data-visible="false">
          <div class="mobile-nav__header">
            <button class="mobile-nav__close" aria-label="Close menu">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M18 6L6 18M6 6L18 18"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>

          <ul class="primary-nav__list flex-align-center">
            <li class="primary-nav__item flex-align-center">
              <a href="index.html">
                <span class="primary-nav__number">00</span> Home
              </a>
            </li>
            <li class="primary-nav__item flex-align-center">
              <a href="destination.html">
                <span class="primary-nav__number">01</span> Destination
              </a>
            </li>
            <li
              class="primary-nav__item flex-align-center primary-nav__item--active"
            >
              <a href="crew.html">
                <span class="primary-nav__number">02</span> Crew
              </a>
            </li>
            <li class="primary-nav__item flex-align-center">
              <a href="technology.html">
                <span class="primary-nav__number">03</span> Technology
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <main class="page-main--crew container">
        <h1 class="crew__title page-title flex-align-center">
          <span class="page__title-number">02</span> MEET YOUR CREW
        </h1>

        <div class="page-grid">
          <div class="crew__content-wrapper">
            <div class="crew__content">
              <div class="crew__info">
                <div class="crew__member">
                  <div class="crew__member-heading">
                    <p class="crew__subtitle">Commander</p>
                    <h2 class="crew__crew-name">Douglas Hurley</h2>
                  </div>

                  <p class="crew__description">
                    Douglas Gerald Hurley is an American engineer, former Marine
                    Corps pilot and former NASA astronaut. He launched into
                    space for the third time as commander of Crew Dragon Demo-2.
                  </p>
                </div>

                <div class="crew__bullets">
                  <ul class="crew__bullets-list">
                    <li class="crew__bullet crew__bullet--active"></li>
                    <li class="crew__bullet"></li>
                    <li class="crew__bullet"></li>
                    <li class="crew__bullet"></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>

          <div class="crew__heading">
            <div class="crew_image-wrapper">
              <img
                class="crew__image"
                src="assets/crew/image-douglas-hurley.webp"
                alt="Hurley"
              />
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
